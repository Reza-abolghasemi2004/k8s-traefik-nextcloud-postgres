apiVersion: traefik.io/v1alpha1
kind: ingressRoute
metadata:
  name: traefik-dashboard
  namespace: default

spec:
  entryPoints:
    - websecure
  routes:
    - kind: Host(`traefik.YOURDOMAIN.com`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      services:
        - name: api@internal
          kind: TraefikService

  tls:
    secretName: traefik-tls

